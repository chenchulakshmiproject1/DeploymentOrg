<template>
    <template if:true={showCostSheet}>
        <div class="class">
            <div style="padding: 15px; background:#e6e6e6; font-size: 20px; font-weight: 500" class="slds-align_absolute-center">
                Generate Cost Sheet
            </div>
            <div class="slds-p-around_medium">
                <p>Kindly select the cost sheet you wish to use for generating the document. Please note that none have been finalized yet.</p>
                <lightning-combobox label="Select Cost Sheet" value={selectedCostSheet} options={costSheetOptions} onchange={handleChange} class="slds-p-top_small"></lightning-combobox>
            </div>
            <div class="slds-align_absolute-center" style="background-color: #e6e6e6; padding: 15px;">
                <lightning-button variant="brand" label="Cancel" onclick={handleCancel} class="slds-m-left_x-small"></lightning-button>
                <lightning-button variant="brand" label="Generate Cost Sheet" onclick={generateDocument} class="slds-m-left_x-small"></lightning-button>
            </div>
        </div>
    </template>

    <template if:false={showCostSheet}>
        <template if:true={showSpinner}>
            <div style="height: 500px;">
                <c-custom-spinner></c-custom-spinner>
            </div>
        </template>
        <template if:false={showSpinner}>
            <iframe src={subDocUrl} width="100%" height="800px"></iframe>
            <div style="text-align: center; margin-top: 20px;">
                <div style="text-align: center; margin-top: 20px;">
               <lightning-button label="Cancel" variant="brand" onclick={handleCancel} class="slds-m-left_x-small" ></lightning-button>
               <lightning-button label="Send to Customer" variant="brand" onclick={sendEmailtoCustomerwithAttachment} class="slds-m-left_x-small" ></lightning-button>
           </div>
           </div>
        </template>
         
    </template>

</template>
