<template>
  <template if:false={showChildComponent}>
      <lightning-card title="Edit Car Parking" icon-name="custom:custom63">
          <template if:true={costSheets}>
              <template if:true={costSheets.length}>
                  <table class="slds-table slds-table_bordered">
                      <thead>
                          <tr>
                              <th>Select</th>
                              <th>Name</th>
                              <th>Unit</th>
                              <th>Total Pricing Value</th>
                          </tr>
                      </thead>
                      <tbody>
                          <template for:each={costSheets} for:item="costSheet">
                              <tr key={costSheet.Id}>
                                  <td>
                                      <lightning-input type="radio" name="selectedCostSheet" value={costSheet.Id} onchange={handleSelection}></lightning-input>
                                  </td>
                                  <td>{costSheet.Name}</td>
                                  <td>{costSheet.UnitName}</td>
                                  <td>{costSheet.Total_Pricing_Value__c}</td>
                              </tr>
                          </template>
                      </tbody>
                  </table>
                  <template if:true={noCostSheets}>
                      <p>No Cost Sheets found for this Opportunity.</p>
                  </template>
              </template>

              <template if:true={isLoading}>
                  <lightning-spinner size="large" alternative-text="Loading"></lightning-spinner>
              </template>

              <div class="slds-grid slds-grid_vertical-align-end slds-m-top_medium">
                  <div class="slds-col slds-text-align_right">
                      <lightning-button variant="brand" label="Next" onclick={handleNext}></lightning-button>
                  </div>
              </div>
          </template>
      </lightning-card>
  </template>

  <template if:true={showChildComponent}>
      <c-parking-details 
          selected-cost-sheet-id={selectedCostSheetId}  
          cost-sheet-name={selectedCostSheet.Name}
          unit-name={selectedCostSheet.UnitName}
          total-pricing-value={selectedCostSheet.Total_Pricing_Value__c}
          unit-id={selectedCostSheet.Unit__c}
          onclose={handleCloseChildComponent}
          no-related-unit-message={noRelatedUnitMessage} >
      </c-parking-details>
  </template>
</template>
