<template>
    <lightning-card style="height: 250px;">
        <div class="slds-p-horizontal_medium slds-p-vertical_medium">
            <h2 style="padding: 12px;background-color: #906a09; color:white; border-radius:5px;" class="slds-text-heading_medium slds-text-align_center">Agreement Signed By Customer-Confirmation</h2>
            <div class="slds-p-vertical_small" style="font-weight: 600; color:green;margin-top:20px;">
                <p style="font-size:medium;text-align:center;">Please confirm if Customer has verified their data or not?</p>
            </div>
            <div style="text-align:center;margin-top:40px;">
                <lightning-button
                variant="brand"
                class="slds-button_brand"
                onclick={handleVerify}
                disabled={isDisabled}
                label="Verify">
                </lightning-button>
            </div>
        </div>
    </lightning-card>
</template>
