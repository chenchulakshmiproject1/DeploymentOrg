<template>
    <div class="container">
        <div class="page-header">
            <div class="page-title">
                <div style="display:flex;align-items:center;gap:12px;">
                    <span class="title-icon">
                        <lightning-icon icon-name="utility:upload" size="medium"></lightning-icon>
                    </span>
                    <div>
                        <h1>Inventory Upload</h1>
                        <span>Upload and manage property inventory data</span>
                    </div>
                </div>
            </div>
            <div class="header-actions">
                <button class="btn-outline" onclick={handleUpload}>
                    <lightning-icon icon-name="utility:upload" size="x-small" class="btn-slds-icon"></lightning-icon>
                    <span>Upload File</span>
                </button>

                <button class="btn-outline" onclick={downloadTemplate}>
                    <lightning-icon icon-name="utility:download" size="x-small" class="btn-slds-icon"></lightning-icon>
                    <span>Download Template</span>
                </button>
                <button class="btn-primary" >
                    <lightning-icon icon-name="utility:add" size="x-small" class="btn-slds-icon"></lightning-icon>
                    <span>Add Unit</span>
                </button>
               

                <input type="file" accept=".csv" class="upload" onchange={handleFileUpload} style="display:none;"/>
            </div>
        </div>

        <div class="drop-zone"
            ondragover={handleDragOver}
            ondragleave={handleDragLeave}
            ondrop={handleDrop}
            onclick={openFilePicker}>

            <div class="drop-content">
                <lightning-icon icon-name="utility:upload" size="large"></lightning-icon>
                <p class="drop-title">Drag & drop your file here</p>
                <p class="drop-sub">Supports .csv files up to 10MB</p>
            </div>

            <input type="file" accept=".csv" class="upload" onchange={handleFileUpload} style="display:none;" />
        </div>

        <template if:true={showHeaderErrors}>
            <div class="error-summary">
                <strong>Header Errors: </strong>{headerErrorMessage}
            </div>
        </template>

        <template if:true={hasRowErrors}>
            <div class="error-summary">
                <strong>Row Errors: </strong>{rowErrorRows}
            </div>
        </template>

        <template if:true={headers.length}>
                <div class="content-area">
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <template for:each={headers} for:item="header">
                                    <th key={header}>{header}</th>
                                </template>
                            </tr>
                        </thead>
                        <tbody>
                            <template for:each={paginatedRowsToDisplay} for:item="row">
                                <tr key={row.id}>
                                    <template for:each={row.cells} for:item="cell">
                                        <td key={cell.id} class={cell.className}>
                                            {cell.value}
                                        </td>
                                    </template>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                    <c-custom-pagination-component
                            class="previewPagination"
                            list={previewData}
                            onpagechanged={jobPaginationCallback}>
                        </c-custom-pagination-component>
                </div>
                <template if:true={canSave}>
                    <div class="slds-align_absolute-center">
                    <button class="btn-primary" onclick={handleSave} style="padding: 10px 20px;border-radius:6px;margin-top:8px">
                        <!-- <lightning-icon icon-name="utility:save" size="x-small" class="btn-slds-icon"></lightning-icon> -->
                        <span>Save</span>
                    </button></div>
                </template>
            </div>
        </template>
                <div class="project-filter">
            <div class="project-dropdown" onclick={toggleDropdown}>
                <span>{selectedProjectNames}</span>
                <lightning-icon icon-name="utility:down"
                                size="x-small"
                                class="dropdown-icon">
                </lightning-icon>
            </div>

            <template if:true={showDropdown}>
                <div class="project-dropdown-list">
                    <template for:each={projectOptions} for:item="proj">
                        <div key={proj.value} class="project-option">
                            <lightning-input
                                type="checkbox"
                                label={proj.label}
                                value={proj.value}
                                checked={proj.checked}
                                onchange={handleProjectSelect}>
                            </lightning-input>
                        </div>
                    </template>
                </div>
            </template>
        </div>
        <template if:true={existingUnits.length}>
            <div class="summary-card">
                <span class="unit-count">{unitsCount} Units</span>
                <span class="tower-text">across {towersCount} towers</span>
            </div>
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>S.No</th>
                                <th>Unit Id</th>
                                <th>Tower</th>
                                <th>Floor</th>
                                <th>Type</th>
                                <th>Area</th>
                                <th>Status</th>

                            </tr>
                        </thead>
                        <tbody>
                            <template for:each={paginatedUnitData} for:item="row">
                                <tr key={row.sNo}>
                                    <td>{row.sNo}</td>
                                    <td>{row.Name}</td>
                                    <td>{row.towerName}</td>
                                    <td>{row.floorNum}</td>
                                    <td>{row.Unit_Type__c}</td>
                                    <td>{row.Saleable_Area__c} sq.ft</td>
                                    <td>{row.Status__c}</td>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </div>
                <c-custom-pagination-component
                            class="unitPagination"
                            list={filteredUnits}
                            onpagechanged={jobPaginationCallback2}>
                </c-custom-pagination-component>
        </template>
    </div>
</template>
